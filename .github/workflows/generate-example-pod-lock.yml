name: Generate example CocoaPods lockfile

on:
  push:
    branches:
      - fix/example-dependency-audit

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: example
      - run: COREPACK_ENABLE_PROJECT_SPEC=0 corepack yarn install --frozen-lockfile --ignore-scripts --non-interactive
        working-directory: example
      - name: Provide Xcode version probe for dependency resolution
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nprintf "Xcode 16.1\\nBuild version 16B40\\n"\n' > "$RUNNER_TEMP/bin/xcodebuild"
          printf '#!/bin/sh\nif [ "$1" = "-v" ]; then type -P "$2" || true; fi\n' > "$RUNNER_TEMP/bin/command"
          chmod +x "$RUNNER_TEMP/bin/xcodebuild" "$RUNNER_TEMP/bin/command"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bundle exec pod install
        working-directory: example/ios
      - uses: actions/upload-artifact@v4
        with:
          name: example-podfile-lock
          path: example/ios/Podfile.lock
          if-no-files-found: error
